# nginx site cho MCP server — đặt tại /etc/nginx/sites-available/mcp.docshub.io.vn.
#
# ⚠️ Service phía sau KHÔNG do repo này build. Đội backend dựng và chạy nó; file
# này chỉ là phần hạ tầng thuộc quyền quản lý domain của FE.
#
# Trước khi dùng, cần hỏi đội backend đúng hai thứ:
#   1. Service bind ở cổng nào trên host  → sửa MCP_PORT bên dưới
#   2. Endpoint là /mcp hay đường dẫn khác → sửa location nếu khác
#
# Cài đặt:
#   # Trỏ DNS A record: mcp.docshub.io.vn -> IP của EC2 (cùng IP với docshub.io.vn)
#   sudo cp deployments/ec2/nginx/mcp.docshub.io.vn.conf \
#           /etc/nginx/sites-available/mcp.docshub.io.vn
#   sudo ln -sf /etc/nginx/sites-available/mcp.docshub.io.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.docshub.io.vn --redirect
#
# certbot tự thêm block listen 443 + ssl_certificate vào file trong /etc/nginx.
# Đừng copy đè file này lên sau đó.

server {
    listen 80;
    listen [::]:80;

    server_name mcp.docshub.io.vn;

    location / {
        # MCP_PORT: hỏi đội backend. 8080 chỉ là giá trị mặc định để nginx -t chạy được.
        proxy_pass http://127.0.0.1:8080;

        # HTTP/1.1 là bắt buộc: Streamable HTTP dùng Server-Sent Events, mà SSE
        # không hoạt động trên HTTP/1.0.
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE stream sẽ hỏng nếu nginx gom buffer rồi mới trả — client không nhận
        # được event nào cho tới khi server đóng kết nối.
        proxy_buffering off;
        proxy_cache off;

        # MCP giữ kết nối mở chờ server đẩy message xuống. Mặc định 60s sẽ cắt
        # ngang stream và client báo lỗi mà không rõ lý do.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # Header MCP dùng gạch ngang, nginx mặc định vẫn chuyển tiếp bình thường.
        # Ghi lại đây để người sau biết là đã cân nhắc, không phải bỏ sót:
        #   Mcp-Session-Id, Mcp-Protocol-Version, Authorization
    }
}
