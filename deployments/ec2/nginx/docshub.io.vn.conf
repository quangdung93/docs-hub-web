# nginx site cho web — đặt tại /etc/nginx/sites-available/docshub.io.vn.
#
#   sudo cp deployments/ec2/nginx/docshub.io.vn.conf \
#           /etc/nginx/sites-available/docshub.io.vn
#   sudo ln -sf /etc/nginx/sites-available/docshub.io.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d docshub.io.vn --redirect
#
# certbot sẽ tự thêm block listen 443 + ssl_certificate + redirect 80->443 vào
# file trong /etc/nginx. Đừng copy đè file này lên sau đó.
server {
    listen 80;
    listen [::]:80;

    server_name docshub.io.vn;

    # Next.js chạy trong container, bind 127.0.0.1:3000 trên host.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Asset build ra có hash trong tên nên cache được lâu.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
