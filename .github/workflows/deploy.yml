# Build image -> đẩy lên GHCR -> deploy lên EC2.
#
# Cùng mô hình với repo docs-hub-api:
#   - build-push chạy trên runner của GitHub (amd64 native, không emulation).
#   - deploy chạy trên self-hosted runner NGAY TRÊN EC2, nên không phải mở
#     port 22 cho dải IP của GitHub, và EC2 không phải chạy `next build`
#     (máy 2 vCPU/4GB không kham nổi).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image muốn deploy (bỏ trống = build từ commit hiện tại)'
        required: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Xác định tag
        id: meta
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64
          push: true
          # NEXT_PUBLIC_* bị inline vào bundle lúc build nên phải truyền ở đây,
          # đặt lúc chạy container là quá muộn.
          build-args: |
            NEXT_PUBLIC_APP_NAME=Document Hub
            NEXT_PUBLIC_APP_ENV=production
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, docs-hub-ec2]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Đăng nhập GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Kéo image mới
        env:
          WEB_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
        run: |
          docker compose -f deployments/ec2/docker-compose.yml \
            --env-file /home/web/docs-hub-web/.env.ec2 pull web

      - name: Khởi động web
        env:
          WEB_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
        run: |
          docker compose -f deployments/ec2/docker-compose.yml \
            --env-file /home/web/docs-hub-web/.env.ec2 up -d web

      - name: Kiểm tra web đã phục vụ
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "✅ web trả 200 sau ${i} lần thử"
              exit 0
            fi
            sleep 2
          done
          echo "❌ web không phục vụ sau 60s — log 50 dòng cuối:"
          docker compose -f deployments/ec2/docker-compose.yml \
            --env-file /home/web/docs-hub-web/.env.ec2 logs --tail 50 web
          exit 1

      # -a (không chỉ dangling): image tag cũ ghcr.io/...:<sha> vẫn có tag nên
      # `prune` không -a sẽ KHÔNG bao giờ xoá chúng — đĩa cứ thế phình theo mỗi
      # lần deploy. 24h đủ để rollback nhanh bằng image còn nằm sẵn trên máy;
      # xa hơn thì compose pull lại từ GHCR.
      # Image của container đang chạy không bị đụng tới.
      # `image prune` KHÔNG đụng tới build cache — trên máy này cache từng phình
      # tới 5.6GB (lớn hơn toàn bộ image cộng lại) từ thời còn build tại chỗ.
      - name: Dọn image + build cache cũ
        if: always()
        run: |
          docker image prune -af --filter "until=24h"
          docker builder prune -af --filter "until=24h"
