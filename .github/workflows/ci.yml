# Kiểm tra chất lượng — chạy cho mọi pull request.
name: ci

# Chỉ chạy trên pull_request: nếu bật cả push thì mỗi commit trong PR kích hoạt
# hai lần chạy trùng nhau. Push lên main đã có deploy.yml kiểm tra trước khi build.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build luôn trong CI: lỗi build của Next (server component, env schema...)
      # thường không lộ ra ở lint/typecheck.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # env.ts validate lúc import, nên phải có giá trị hợp lệ khi build.
          APP_ENV: production
          API_URL: http://api:8080/public/api/v1
          ENABLE_MOCKS: 'false'
          AUTH_SECRET: ci-placeholder-secret-32-characters
